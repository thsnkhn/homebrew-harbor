name: Update Harbor cask

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-harbor-cask
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask from latest Harbor release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$RUNNER_TEMP/harbor-release.json"
          gh api repos/thsnkhn/harbor/releases/latest > "$release_json"
          version="$(python3 scripts/update_cask.py "$release_json")"

          git diff --check
          if git diff --quiet; then
            echo "Cask is already current at $version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/harbor.rb
          git commit -m "chore: update Harbor cask to $version"
          git push
